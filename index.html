<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncUp! Landing Page</title>
    <link rel="stylesheet" href="styles1.css">
    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav">
        <div class="left-nav">
            <h1>SyncUp!</h1>
        </div>
        <div class="right-nav">
            <button class="sign-in">Sign In</button>
            <button class="contact">Contact Us</button>
        </div>
    </nav>

    <section class="hero">
        <img src="/Img/hero-img.png" alt="" class="hero-img">
        
        <div class="hero-content">
            <h1>
                Take Control of Your Time with a Fully Organised Google Calendar!
            </h1>

            <p class="shorter">
                I set up your personalised schedule so you stop feeling overwhelmed
                and actually know what to do each day.
            </p>

            <div class="hero-buttons">
                <button class="booking">Book Now!</button>
                <button class="scroller">See How it Works</button>
            </div>
        </div>
    </section>

    <section class="problem"></section>

    <script src="script.js"></script>
</body>
</html>
